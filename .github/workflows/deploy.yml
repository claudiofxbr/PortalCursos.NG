name: CI/CD PortalCursos.NG - OMEGA DEPLOY

on:
  push:
    branches: [ "main", "production" ]

jobs:
  deploy:
    name: Production Deploy (Hostinger)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Execute Remote Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOSTINGER_IP }}
        username: ${{ secrets.HOSTINGER_USER }}
        key: ${{ secrets.HOSTINGER_SSH_KEY }}
        port: 22
        script: |
          echo "🚀 Conectado à VPS: ${{ secrets.HOSTINGER_IP }}"
          
          # 1. Navegar para o diretório (ajuste conforme seu caminho na VPS)
          cd /var/www/portalcursos || { echo "❌ Diretório não encontrado"; exit 1; }
          
          # 2. Atualizar código via Git
          echo "📥 Atualizando código..."
          git fetch origin main
          git reset --hard origin/main
          
          # 3. Garantir permissões nos scripts
          chmod +x devops/scripts/deploy_omega.sh
          
          # 4. Executar o Script de Deploy Unificado OMEGA
          echo "🏗️  Iniciando Build e Deploy..."
          ./devops/scripts/deploy_omega.sh
          
          echo "✅ Deploy Finalizado com Sucesso!"
