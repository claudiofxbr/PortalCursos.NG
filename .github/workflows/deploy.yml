name: CI/CD PortalCursos.NG - OMEGA DEPLOY

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Production Deploy (Hostinger)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Execute Remote Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOSTINGER_IP }}
        username: ${{ secrets.HOSTINGER_USER }}
        key: ${{ secrets.HOSTINGER_SSH_KEY }}
        port: 22
        script: |
          echo "🚀 Conectado à VPS: ${{ secrets.HOSTINGER_IP }}"
          
          # Navegar para o diretório de produção
          cd /var/www/portalcursos || { echo "❌ Diretório /var/www/portalcursos não encontrado"; exit 1; }
          
          # Sincronizar código com o GitHub
          echo "📥 Atualizando código..."
          git fetch origin main
          git reset --hard origin/main
          
          # Garantir permissões de execução
          echo "🔐 Garantindo permissões nos scripts..."
          chmod +x devops/scripts/*.sh
          
          # Executar o deploy automatizado (Backend + Frontend + PM2)
          echo "🏗️ Iniciando Ciclo de Deploy OMEGA..."
          ./devops/scripts/deploy_omega.sh
          
          echo "✅ PortalCursos.NG atualizado com sucesso!"
