name: CI/CD PortalCursos.NG

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Backend build & tests
        working-directory: backend
        run: ./mvnw -B clean verify

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install & build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://xavierbr-vps.tech
          NEXT_PUBLIC_BASE_PATH: /portalcursos.ng
        run: |
          npm ci
          npm run build

  security-scan:
    name: Scan de Vulnerabilidades (Trivy)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build imagem backend
        run: docker build -t portalcursos-backend:scan -f backend/Dockerfile backend

      - name: Build imagem frontend
        run: |
          docker build -t portalcursos-frontend:scan -f frontend/Dockerfile frontend \
            --build-arg NEXT_PUBLIC_API_URL=https://xavierbr-vps.tech \
            --build-arg NEXT_PUBLIC_BASE_PATH=/portalcursos.ng

      # vuln-type: os — escaneia apenas pacotes do sistema operacional (Alpine).
      # CVEs de dependências Java/npm (pom.xml, package.json) NÃO bloqueiam o
      # deploy aqui: tentamos ampliar para 'os,library' em ago/2026 e o scan
      # real acusou 37 vulnerabilidades só no backend (31 HIGH/6 CRITICAL,
      # a maior parte exigindo upgrade de Jackson/Spring Boot) — upgrade de
      # dependência core é um projeto à parte (risco de regressão, precisa de
      # testes dedicados), não algo a resolver ad-hoc num gate de CI. Ver PR
      # #25 para o levantamento completo de CVEs de aplicação pendentes
      # (backlog a priorizar).
      #
      # Os dois scans (backend/frontend) sempre rodam, mesmo se um falhar —
      # sem isso, o job parava no primeiro scan que falhasse e o outro nunca
      # era executado, escondendo vulnerabilidades do segundo componente.
      - name: Trivy scan — backend (SO, CRITICAL/HIGH falha o build)
        id: trivy-backend
        uses: aquasecurity/trivy-action@v0.24.0
        continue-on-error: true
        with:
          image-ref: portalcursos-backend:scan
          vuln-type: 'os'
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy scan — frontend (SO, CRITICAL/HIGH falha o build)
        id: trivy-frontend
        uses: aquasecurity/trivy-action@v0.24.0
        continue-on-error: true
        with:
          image-ref: portalcursos-frontend:scan
          vuln-type: 'os'
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Falha o job se algum scan encontrou vulnerabilidade
        if: steps.trivy-backend.outcome == 'failure' || steps.trivy-frontend.outcome == 'failure'
        run: |
          echo "❌ Trivy encontrou vulnerabilidades CRITICAL/HIGH — veja os passos de scan acima."
          exit 1

  deploy:
    name: Deploy → VPS Hostinger
    needs: [test, security-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate required secrets
        run: |
          [ -n "${{ secrets.HOSTINGER_IP }}" ]      || { echo "❌ Secret HOSTINGER_IP não configurado"; exit 1; }
          [ -n "${{ secrets.HOSTINGER_USER }}" ]    || { echo "❌ Secret HOSTINGER_USER não configurado"; exit 1; }
          [ -n "${{ secrets.HOSTINGER_SSH_KEY }}" ] || { echo "❌ Secret HOSTINGER_SSH_KEY não configurado"; exit 1; }
          echo "✅ Secrets validados"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 35m
          script: |
            set -e
            echo "🚀 Deploy iniciado em: $(date)"
            echo "📍 Servidor: $(hostname)"

            PROJECT_ROOT="/var/www/portalcursos"

            # Verificar que o diretório existe
            [ -d "$PROJECT_ROOT" ] || { echo "❌ Diretório $PROJECT_ROOT não encontrado — execute deploy_vps.sh primeiro"; exit 1; }

            # Verificar que o .env existe com variáveis críticas
            ENV_FILE="$PROJECT_ROOT/.env"
            [ -f "$ENV_FILE" ] || { echo "❌ .env não encontrado em $ENV_FILE"; exit 1; }
            for VAR in APP_JWT_SECRET SPRING_DATASOURCE_URL APP_ROOT_PASSWORD APP_ADMIN_PASSWORD PORTAL_ACCESS_CODE; do
                val=$(grep "^${VAR}=" "$ENV_FILE" | cut -d= -f2- | tr -d '\r' || true)
                [ -n "$val" ] || { echo "❌ Variável $VAR ausente no .env"; exit 1; }
            done
            echo "✅ .env validado"

            cd "$PROJECT_ROOT"

            # Bootstrap: sync code first so deploy_ci.sh itself is up-to-date
            git fetch origin main --depth=1
            git reset --hard FETCH_HEAD
            echo "✅ Código sincronizado: $(git log --oneline -1)"

            chmod +x devops/scripts/deploy_ci.sh
            bash devops/scripts/deploy_ci.sh
