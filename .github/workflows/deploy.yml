name: CI/CD PortalCursos.NG

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy → VPS Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          [ -n "${{ secrets.HOSTINGER_IP }}" ]      || { echo "❌ Secret HOSTINGER_IP não configurado"; exit 1; }
          [ -n "${{ secrets.HOSTINGER_USER }}" ]    || { echo "❌ Secret HOSTINGER_USER não configurado"; exit 1; }
          [ -n "${{ secrets.HOSTINGER_SSH_KEY }}" ] || { echo "❌ Secret HOSTINGER_SSH_KEY não configurado"; exit 1; }
          echo "✅ Secrets validados"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 22
          command_timeout: 35m
          script: |
            set -e
            echo "🚀 Deploy iniciado em: $(date)"
            echo "📍 Servidor: $(hostname)"

            PROJECT_ROOT="/var/www/portalcursos"

            # Verificar que o diretório existe
            [ -d "$PROJECT_ROOT" ] || { echo "❌ Diretório $PROJECT_ROOT não encontrado — execute deploy_vps.sh primeiro"; exit 1; }

            # Verificar que o .env existe com variáveis críticas
            ENV_FILE="$PROJECT_ROOT/.env"
            [ -f "$ENV_FILE" ] || { echo "❌ .env não encontrado em $ENV_FILE"; exit 1; }
            for VAR in APP_JWT_SECRET SPRING_DATASOURCE_URL APP_ROOT_PASSWORD APP_ADMIN_PASSWORD; do
                val=$(grep "^${VAR}=" "$ENV_FILE" | cut -d= -f2- | tr -d '\r' || true)
                [ -n "$val" ] || { echo "❌ Variável $VAR ausente no .env"; exit 1; }
            done
            echo "✅ .env validado"

            cd "$PROJECT_ROOT"

            # Bootstrap: sync code first so deploy_ci.sh itself is up-to-date
            git fetch origin main --depth=1
            git reset --hard FETCH_HEAD
            echo "✅ Código sincronizado: $(git log --oneline -1)"

            chmod +x devops/scripts/deploy_ci.sh
            bash devops/scripts/deploy_ci.sh
