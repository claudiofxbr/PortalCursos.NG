version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: portalcursos_db
    environment:
      POSTGRES_DB: portalcursos_db
      POSTGRES_USER: portal_admin
      POSTGRES_PASSWORD: portal_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
