version: '3.8'

services:
  postgres:
    image: postgres:15@sha256:bcab099bfaab33333a73a2ebe8c1d615c9f4c2402dd43452f989a36c6da9a5ba
    container_name: portalcursos_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portalcursos_db}
      POSTGRES_USER: ${POSTGRES_USER:-portal_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em backend/.env (nunca hardcode senha de dev)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
