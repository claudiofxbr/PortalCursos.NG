# Dados do Banco de Dados (Protocolo OMEGA-ULTRA V20.0)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-small-shadow-acm4l09l-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require&assumeMinServerVersion=14&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_68oNjuEsZGAi}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Pool Hikari (ULTRA-RESILIENT - Neon Serverless)
spring.datasource.hikari.pool-name=UltraNeonPool-V20
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=120000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.leak-detection-threshold=2000

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Otimização Neon Serverless
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# SQL Init (Criação de Tabelas, Índices e Dados Iniciais)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:setup-database.sql
spring.sql.init.continue-on-error=true

# Configuração de Performance e Memória
spring.main.banner-mode=off
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# Origens permitidas para CORS (Explicitamente listadas para suportar allowCredentials=true)
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,https://portalcursos-backend.onrender.com,https://portalcursos-frontend.onrender.com,https://*.vercel.app,https://*.hostingersite.com

# Configuração da Porta do Servidor
server.port=${PORT:8080}

# Logging (Reduzido para economizar CPU, DEBUG apenas em pacotes específicos)
logging.level.root=INFO
logging.level.com.portalcursos.ng02=INFO

# JWT Config
portalcursos.jwt.secret=ZXhhbXBsZS1zZWNyZXQta2V5LXdpdGgtZW5vdWdoLWxlbmd0aC1mb3ItYmFzZTY0LWVuY29kaW5nLXByb3Blcmx5
portalcursos.jwt.expiration=900000
portalcursos.jwt.refresh-expiration=604800000
portalcursos.jwt.access-cookie-name=portal_access_token
portalcursos.jwt.refresh-cookie-name=portal_refresh_token

# Configuração de Upload de Arquivos
app.upload.dir=uploads/documents
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB
