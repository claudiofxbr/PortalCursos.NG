# Dados do Banco de Dados (Protocolo OMEGA-ULTRA V20.0)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Pool Hikari (ULTRA-RESILIENT - Neon Serverless)
spring.datasource.hikari.pool-name=UltraNeonPool-V20
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.leak-detection-threshold=5000

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Otimização Neon Serverless
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# SQL Init (DESATIVADO em favor do Flyway)
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Configuração de Performance e Memória
spring.main.banner-mode=off
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# Origens CORS explícitas — sem wildcards (obrigatório com allowCredentials=true)
# Em produção, sobrescreva CORS_ALLOWED_ORIGINS com as origens reais via variável de ambiente
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001}

# Configuração da Porta do Servidor
server.port=${PORT:8080}

# Logging (Reduzido para economizar CPU, DEBUG apenas em pacotes específicos)
logging.level.root=INFO
logging.level.com.portalcursos.ng02=INFO

# JWT Config
portalcursos.jwt.secret=${APP_JWT_SECRET}
portalcursos.jwt.expiration=${APP_JWT_EXPIRATION:900000}
portalcursos.jwt.refresh-expiration=${APP_JWT_REFRESH_EXPIRATION:86400000}
portalcursos.jwt.access-cookie-name=${JWT_ACCESS_COOKIE_NAME:accessToken}
portalcursos.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}

# Em desenvolvimento local (HTTP), desativar Secure nos cookies para permitir login
# Em produção (HTTPS), manter true (padrão)
app.secure-cookies=${APP_SECURE_COOKIES:true}

# Configuração de Upload de Arquivos
app.upload.dir=uploads/documents
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB
