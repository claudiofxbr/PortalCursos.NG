# Propriedades CORS necessárias para subida do contexto nos testes
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# Configurações de Upload de arquivos para testes
app.upload.dir=uploads/documents
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB

