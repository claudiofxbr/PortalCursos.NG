services:
  postgres:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    container_name: portalcursos_postgres
    restart: always
    environment:
      POSTGRES_DB: portalcursos_db
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-portal_admin}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-portal_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - portal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-portal_admin} -d portalcursos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: portalcursos_backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      PORT: 8080
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-900000}
      APP_JWT_REFRESH_EXPIRATION: ${APP_JWT_REFRESH_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_ROOT_PASSWORD: ${APP_ROOT_PASSWORD:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_SECURE_COOKIES: ${APP_SECURE_COOKIES:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Porta local para healthcheck interno do fix_502.sh
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - portal_net
      - easypanel
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      # Router HTTPS para /api
      - "traefik.http.routers.portalcursos-api.rule=Host(`${DOMAIN_NAME:-xavierbr-vps.tech}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.portalcursos-api.entrypoints=https"
      - "traefik.http.routers.portalcursos-api.tls=true"
      - "traefik.http.routers.portalcursos-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portalcursos-api.service=portalcursos-api-svc"
      - "traefik.http.services.portalcursos-api-svc.loadbalancer.server.port=8080"
      - "traefik.http.routers.portalcursos-api.middlewares=portalcursos-security@docker"
      # Middleware de segurança
      - "traefik.http.middlewares.portalcursos-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.portalcursos-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.portalcursos-security.headers.stsPreload=true"
      - "traefik.http.middlewares.portalcursos-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.portalcursos-security.headers.frameDeny=true"
      - "traefik.http.middlewares.portalcursos-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.portalcursos-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      # Router HTTP para /api (redireciona para HTTPS)
      - "traefik.http.routers.portalcursos-api-http.rule=Host(`${DOMAIN_NAME:-xavierbr-vps.tech}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.portalcursos-api-http.entrypoints=http"
      - "traefik.http.routers.portalcursos-api-http.middlewares=redirect-to-https@file"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://xavierbr-vps.tech}
        - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-/portalcursos.ng}
    container_name: portalcursos_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://xavierbr-vps.tech}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/portalcursos.ng}
      NEXT_PUBLIC_ENV: production
      PORT: 3000
      # Sem prefixo NEXT_PUBLIC_ — lido só no servidor (Route Handler
      # /api/portal-auth), nunca embutido no bundle do cliente. Sem essa
      # var o gate de senha global fica fail-closed (sempre 500/nega acesso).
      PORTAL_ACCESS_CODE: ${PORTAL_ACCESS_CODE}
    healthcheck:
      # 127.0.0.1 explícito: o server.js standalone do Next.js faz bind
      # IPv4-only (HOSTNAME=0.0.0.0); "localhost" resolve ::1 primeiro no
      # Alpine e o wget falha com "Connection refused" mesmo com app saudável.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/portalcursos.ng || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Porta local para healthcheck interno do fix_502.sh
    ports:
      - "127.0.0.1:3010:3000"
    networks:
      - portal_net
      - easypanel
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      # Router HTTPS para /portalcursos.ng
      - "traefik.http.routers.portalcursos-fe.rule=Host(`${DOMAIN_NAME:-xavierbr-vps.tech}`) && PathPrefix(`/portalcursos.ng`)"
      - "traefik.http.routers.portalcursos-fe.entrypoints=https"
      - "traefik.http.routers.portalcursos-fe.tls=true"
      - "traefik.http.routers.portalcursos-fe.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portalcursos-fe.service=portalcursos-fe-svc"
      - "traefik.http.services.portalcursos-fe-svc.loadbalancer.server.port=3000"
      - "traefik.http.routers.portalcursos-fe.middlewares=portalcursos-security@docker"
      # Router HTTPS para _next/static (assets imutaveis)
      - "traefik.http.routers.portalcursos-static.rule=Host(`${DOMAIN_NAME:-xavierbr-vps.tech}`) && PathPrefix(`/_next/static`)"
      - "traefik.http.routers.portalcursos-static.entrypoints=https"
      - "traefik.http.routers.portalcursos-static.tls=true"
      - "traefik.http.routers.portalcursos-static.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portalcursos-static.service=portalcursos-fe-svc"
      # Router HTTP para /portalcursos.ng (redireciona para HTTPS)
      - "traefik.http.routers.portalcursos-fe-http.rule=Host(`${DOMAIN_NAME:-xavierbr-vps.tech}`) && PathPrefix(`/portalcursos.ng`)"
      - "traefik.http.routers.portalcursos-fe-http.entrypoints=http"
      - "traefik.http.routers.portalcursos-fe-http.middlewares=redirect-to-https@file"
      # Router para favicon.ico na raiz (evita 404 no browser — basePath
      # exige que o asset real seja servido em /portalcursos.ng/favicon.ico)
      - "traefik.http.routers.portalcursos-favicon.rule=Host(`${DOMAIN_NAME:-xavierbr-vps.tech}`) && Path(`/favicon.ico`)"
      - "traefik.http.routers.portalcursos-favicon.entrypoints=https"
      - "traefik.http.routers.portalcursos-favicon.tls=true"
      - "traefik.http.routers.portalcursos-favicon.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portalcursos-favicon.service=portalcursos-fe-svc"
      - "traefik.http.routers.portalcursos-favicon.middlewares=portalcursos-favicon-rewrite@docker"
      - "traefik.http.middlewares.portalcursos-favicon-rewrite.replacepathregex.regex=^/favicon.ico$$"
      - "traefik.http.middlewares.portalcursos-favicon-rewrite.replacepathregex.replacement=/portalcursos.ng/favicon.ico"
      # Router raiz: redireciona / para /portalcursos.ng
      - "traefik.http.routers.portalcursos-root.rule=Host(`${DOMAIN_NAME:-xavierbr-vps.tech}`) && Path(`/`)"
      - "traefik.http.routers.portalcursos-root.entrypoints=https"
      - "traefik.http.routers.portalcursos-root.tls=true"
      - "traefik.http.routers.portalcursos-root.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portalcursos-root.middlewares=redirect-root@docker"
      - "traefik.http.middlewares.redirect-root.redirectregex.regex=^https://([^/]+)/?$"
      - "traefik.http.middlewares.redirect-root.redirectregex.replacement=https://$$1/portalcursos.ng"
      - "traefik.http.middlewares.redirect-root.redirectregex.permanent=true"
      # Nota: redirect-to-https@file é definido pelo EasyPanel no main.yaml

networks:
  portal_net:
    driver: bridge
  # Rede do EasyPanel/Traefik - deve existir na VPS
  easypanel:
    external: true

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local
