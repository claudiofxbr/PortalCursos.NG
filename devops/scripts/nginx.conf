# Configuração Nginx Ultra-Resiliente - PortalCursos.NG
# Localização: /etc/nginx/sites-available/portalcursos

# Bloco HTTP (Porta 80) - Redireciona para HTTPS e permite renovação Certbot
server {
    listen 80;
    listen [::]:80;
    server_name xavierbr-vps.tech www.xavierbr-vps.tech;

    # Permitir renovação do Certbot sem redirecionamento
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirecionar todo tráfego HTTP para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Bloco HTTPS (Porta 443) - Ativo para conexões seguras sob domínio
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xavierbr-vps.tech www.xavierbr-vps.tech;

    # SSL - Certificados (Caminhos padrão Certbot)
    ssl_certificate /etc/letsencrypt/live/xavierbr-vps.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xavierbr-vps.tech/privkey.pem;

    # Otimização SSL
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Frontend (Next.js) - Porta 3010
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Backend (Spring Boot) - Porta 8090
    location /api {
        proxy_pass http://127.0.0.1:8090/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Otimização Neon (Resiliência Cold Start)
        proxy_read_timeout 150s;
        proxy_connect_timeout 150s;
        proxy_send_timeout 150s;
    }

    # Estáticos e Uploads
    location /uploads {
        alias /var/www/portalcursos/uploads;
        access_log off;
        expires 30d;
    }

    # Cabeçalhos de Segurança OMEGA
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
