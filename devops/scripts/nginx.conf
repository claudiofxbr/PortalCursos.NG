# PortalCursos.NG - Nginx Config
# Localização na VPS: /etc/nginx/sites-available/portalcursos
#
# Arquitetura:
#   Frontend (Next.js)  -> container porta 3000 -> host porta 3010
#   Backend  (Spring)   -> container porta 8080 -> host porta 8090
#   Nginx escuta 80/443 e faz proxy para os containers

# --- HTTP: redireciona para HTTPS e serve ACME challenge ---
server {
    listen 80;
    listen [::]:80;
    server_name xavierbr-vps.tech www.xavierbr-vps.tech;

    # Let's Encrypt ACME challenge (nao redirecionar esta rota)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: configuracao principal ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xavierbr-vps.tech www.xavierbr-vps.tech;

    # Certificados Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/xavierbr-vps.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xavierbr-vps.tech/privkey.pem;

    # SSL otimizado (Mozilla Modern)
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # Seguranca
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                  always;
    add_header X-Content-Type-Options     "nosniff"                                     always;
    add_header X-XSS-Protection           "1; mode=block"                               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;

    # --- API Backend (Spring Boot, porta 8090 no host) ---
    # IMPORTANTE: /api deve vir antes de / para ter prioridade
    location /api {
        proxy_pass             http://127.0.0.1:8090/api;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     150s;
        proxy_connect_timeout  30s;
        proxy_send_timeout     150s;
        # Passa cookies HttpOnly sem modificacao
        proxy_pass_header      Set-Cookie;
    }

    # --- Uploads estaticos ---
    location /uploads {
        alias      /var/www/portalcursos/uploads;
        access_log off;
        expires    30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --- Frontend Next.js: assets estaticos (_next/) ---
    # Cache agressivo para arquivos imutaveis gerados pelo Next.js
    location /_next/static {
        proxy_pass         http://127.0.0.1:3010/_next/static;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires            365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Frontend Next.js: subpath /portalcursos.ng ---
    # O Next.js e configurado com basePath=/portalcursos.ng
    # Todas as rotas do app comecam com este prefixo
    location /portalcursos.ng {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # --- Raiz: redireciona para o portal ---
    location = / {
        return 301 https://$host/portalcursos.ng;
    }

    # --- Qualquer outra rota nao mapeada ---
    location / {
        return 404;
    }
}
