# PortalCursos.NG — upstreams do nginx (cor ativa)
#
# Instalado em /etc/nginx/conf.d/portalcursos-upstream.conf pelo apply_nginx.sh.
# O nginx.conf faz proxy_pass para http://portalcursos_api / http://portalcursos_web.
#
# DEPLOY_STRATEGY=recreate  -> este arquivo fica estático apontando para a cor blue.
# DEPLOY_STRATEGY=blue-green -> o deploy_ci.sh reescreve este arquivo a cada deploy
#                               (blue = 8090/3010, green = 8091/3011) e faz
#                               `nginx -s reload` para trocar o tráfego sem downtime.
upstream portalcursos_api {
    server 127.0.0.1:8090 max_fails=0;
}
upstream portalcursos_web {
    server 127.0.0.1:3010 max_fails=0;
}
