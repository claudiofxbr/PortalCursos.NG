# Controle de Tokens Claude Code — backend
# Neon: URL JDBC completa, ex.: jdbc:postgresql://ep-xxx.sa-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeno: VPS compartilhada (8 GB, ~15 containers) e Neon serverless
spring.datasource.hikari.pool-name=TokenControlPool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.initialization-fail-timeout=-1
# Reescreve INSERTs em lote como multi-row (1 round-trip) — essencial com a latência até o Neon
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Neon: migrations usam a conexão DIRETA (sem pooler); o tráfego da aplicação usa a URL pooled.
# NEON_DIRECT_URL é opcional — sem ela, o Flyway usa a mesma URL da aplicação.
spring.flyway.url=${NEON_DIRECT_URL:${SPRING_DATASOURCE_URL}}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.enabled=true
# Histórico PRÓPRIO: nunca colide com o flyway_schema_history do PortalCursos.NG caso o banco/branch do Neon
# seja um clone dele. baseline-version=0 garante que a V1 deste app seja aplicada mesmo em schema não-vazio.
spring.flyway.table=token_control_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

spring.main.banner-mode=off
server.port=${PORT:8090}
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.root=INFO

# Chave obrigatória p/ /api/** (collector e BFF do Next). Sem ela a aplicação não sobe.
tokencontrol.api-key=${TOKEN_CONTROL_API_KEY}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Controle do Neon via API de gestão (opcional; somente leitura). Sem as duas variáveis fica desligado.
tokencontrol.neon.api-key=${NEON_API_KEY:}
tokencontrol.neon.project-id=${NEON_PROJECT_ID:}
