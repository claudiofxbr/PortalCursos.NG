# Controle de Tokens Claude Code — stack própria (não compartilha nada com portalcursos/cvfacil).
# Portas do host 8190/3110 (8090/3010/8091/3011 são do PortalCursos.NG). Só em 127.0.0.1: quem expõe é o nginx do host (ver docs/DEPLOY.md).
name: token-control
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?defina no .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?defina no .env}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?defina no .env}
      TOKEN_CONTROL_API_KEY: ${TOKEN_CONTROL_API_KEY:?defina no .env}
      NEON_DIRECT_URL: ${NEON_DIRECT_URL:-${SPRING_DATASOURCE_URL}}
      NEON_API_KEY: ${NEON_API_KEY:-}
      NEON_PROJECT_ID: ${NEON_PROJECT_ID:-}
    ports:
      - "127.0.0.1:8190:8090"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8090
      TOKEN_CONTROL_API_KEY: ${TOKEN_CONTROL_API_KEY:?defina no .env}
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?defina no .env}
    ports:
      - "127.0.0.1:3110:3010"
    mem_limit: 256m
    # Edge atual = Traefik do EasyPanel (rede "easypanel"), mesmo padrão do PortalCursos.NG. Só o frontend é exposto;
    # o backend fica na rede interna do compose. Sem healthcheck no Traefik: a rota exige login (401 sem credencial).
    networks: [default, easypanel]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.tokencontrol-fe.rule=Host(`${DOMAIN_NAME:-xavierbr-vps.tech}`) && PathPrefix(`/tokencontrol`)"
      - "traefik.http.routers.tokencontrol-fe.entrypoints=https"
      - "traefik.http.routers.tokencontrol-fe.tls=true"
      - "traefik.http.routers.tokencontrol-fe.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tokencontrol-fe.service=tokencontrol-fe-svc"
      - "traefik.http.services.tokencontrol-fe-svc.loadbalancer.server.port=3010"
      - "traefik.http.routers.tokencontrol-fe.middlewares=tokencontrol-security@docker"
      - "traefik.http.middlewares.tokencontrol-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.tokencontrol-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.tokencontrol-security.headers.frameDeny=true"
      - "traefik.http.middlewares.tokencontrol-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.tokencontrol-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.tokencontrol-http.rule=Host(`${DOMAIN_NAME:-xavierbr-vps.tech}`) && PathPrefix(`/tokencontrol`)"
      - "traefik.http.routers.tokencontrol-http.entrypoints=http"
      - "traefik.http.routers.tokencontrol-http.middlewares=redirect-to-https@file"

networks:
  easypanel:
    external: true
