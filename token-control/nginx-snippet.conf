# Trecho para o server{} de xavierbr-vps.tech (NÃO aplicado automaticamente — exige confirmação).
# Ingestão do collector e dashboard passam pelo mesmo Next (BFF); a chave do backend nunca sai do servidor.
location /tokencontrol/ {
    proxy_pass http://127.0.0.1:3010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
    client_max_body_size 2m;
}
