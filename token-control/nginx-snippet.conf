# Instalado em /etc/nginx/portalcursos-extra.d/token-control.conf por devops/scripts/apply_token_control_nginx.sh.
# O dashboard e a ingestão do collector passam pelo mesmo Next (BFF); a chave do backend nunca sai do servidor.
location /tokencontrol {
    proxy_pass http://127.0.0.1:3110;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
}
